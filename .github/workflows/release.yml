name: Release

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. A re-run
# picks up fixes to this workflow and the tag verifier only: release scripts,
# CHANGELOG.md and sources come from the tagged commit. Pull requests and
# workflow_dispatch without a tag dry-run: they build artifacts and never mint
# attestations or touch a GitHub Release.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dispatch.yml"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/release-package.sh"
      - "scripts/package.sh"
      - "scripts/validate-release.sh"
      - "security/release-tag-key.asc"
      - "security/release-tag-fingerprints"
      - "RELEASING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scripts:
    name: Release scripts
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - run: bash scripts/validate-release.sh

  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh and allowed keys verify the
  # signed tag against the tagged commit's package.json, and that commit must
  # be on main. A dry run resolves the checked-out commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the signed tag on main
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_ROOT="$PWD" \
            RELEASE_TAG_KEY="${MAIN_TREE}/security/release-tag-key.asc" \
            RELEASE_TAG_FINGERPRINTS="${MAIN_TREE}/security/release-tag-fingerprints" \
            bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Only "release not found" or a draft may continue; a token that
          # cannot see drafts reports a draft as not found.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    needs: [scripts, verify-tag]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          extra=(--git-sha "$SHA")
          if [[ -n "$TAG" ]]; then
            extra+=(--tag "$TAG")
          else
            extra+=(--skip-test)
          fi
          bash scripts/release-package.sh --out release "${extra[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tenkai-console-release
          path: release/
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.provenance.outputs.attestation-url }}
      sbom-attestation-url: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tenkai-console-release
          path: release
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/tenkai-console-v[0-9]*
            release/SHA256SUMS
            release/tenkai-console.cdx.json
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            release/tenkai-console-v[0-9]*
            release/SHA256SUMS
          sbom-path: release/tenkai-console.cdx.json

  # The only job that touches the GitHub Release, and the last one: it drafts
  # (or resumes the draft an earlier run left), uploads every asset, then
  # publishes, so a failed step leaves a draft that a re-run can resume.
  publish:
    name: GitHub Release
    needs: [verify-tag, package, attest]
    if: needs.verify-tag.outputs.tag != '' && needs.package.result == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tenkai-console-release
          path: release
      - name: Refuse a moved tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          live=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)
          if [ "$live" != "$SHA" ]; then
            echo "tag ${TAG} now points to ${live}, not ${SHA}" >&2
            exit 1
          fi
      - name: Record attestation URLs on the manifest
        env:
          PROVENANCE_URL: ${{ needs.attest.outputs.attestation-url }}
          SBOM_URL: ${{ needs.attest.outputs.sbom-attestation-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("release/tenkai-console-release.json")
          manifest = json.loads(path.read_text())
          urls = [u for u in (os.environ.get("PROVENANCE_URL"), os.environ.get("SBOM_URL")) if u]
          manifest["attestations"] = urls
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > release/RELEASE_NOTES.md
      - name: Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          # A re-run resumes its draft; a published release is never touched.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
            # Every dispatch rebuilds every asset; drop the earlier run's so a
            # stale or renamed asset is never published.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release/RELEASE_NOTES.md --draft "${kind[@]}"
          elif [[ "$state" == *"release not found"* ]]; then
            gh release create "$TAG" release/* \
              --draft \
              --verify-tag \
              "${kind[@]}" \
              --title "$TAG" \
              --notes-file release/RELEASE_NOTES.md
          else
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
          echo "Published GitHub Release ${TAG} from CHANGELOG"
          echo "Container images: none"
